name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: uv sync --locked
      - run: uv run pytest

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Create semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | tail -n 1)"
          if [[ -n "$release_tag" ]]; then
            echo "Recovering existing release $release_tag"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$(git tag --list 'v[0-9]*')" ]]; then
            next_version="$(uv run semantic-release version --print)"
            if [[ "$next_version" != "0.1.0" ]]; then
              echo "First release must be 0.1.0, got $next_version" >&2
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run semantic-release version

          release_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | tail -n 1)"
          if [[ -z "$release_tag" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Ensure GitHub release exists
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: uv build --out-dir dist
      - name: Verify distributions
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 1 ]]
          [[ ${#sdists[@]} -eq 1 ]]
      - name: Attach and recover exact release artifacts
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for artifact in dist/*.whl dist/*.tar.gz; do
            name="$(basename "$artifact")"
            if grep -Fxq "$name" <<< "$existing_assets"; then
              echo "Keeping existing release asset $name"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$artifact"
          done

          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          expected_assets="$(for artifact in dist/*.whl dist/*.tar.gz; do basename "$artifact"; done | sort)"
          if [[ "$release_assets" != "$expected_assets" ]]; then
            echo "Unexpected release assets:" >&2
            echo "$release_assets" >&2
            exit 1
          fi

          mkdir -p release-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir release-dist

          shopt -s nullglob
          wheels=(release-dist/*.whl)
          sdists=(release-dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 1 ]]
          [[ ${#sdists[@]} -eq 1 ]]
      - name: Preserve release artifacts for PyPI
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: release-dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
